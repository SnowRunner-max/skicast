<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Wind and weather at five points on Mammoth Mountain, read straight off the lift map." />
    <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#18181a" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Skicast</title>
    <script>
      // Apply the saved (or system) appearance before first paint so there is no flash.
      // The storage key is shared with src/hooks/useTheme.ts; change both together.
      try {
        var saved = localStorage.getItem('skicast:theme')
        var dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches
        if (dark) document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
